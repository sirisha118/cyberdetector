{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block content %}
{% from '_macros.html' import csrf %}
<div class="card auth-card"><div class="card-body p-4">
<h3 class="mb-1">🛡️ CyberShield</h3><p class="text-muted">AI-powered e-mail threat protection</p>
<form method="post">{{ csrf() }}
<div class="mb-3"><label class="form-label">Username or e-mail</label><input name="username" class="form-control" required autofocus></div>
<div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="remember" id="r"><label class="form-check-label" for="r">Remember me</label></div>
<button class="btn btn-accent w-100">Sign in</button></form>
<p class="small text-muted mt-3 mb-0">No account? <a href="{{ url_for('auth.register') }}">Register</a></p>
</div></div>{% endblock %}
