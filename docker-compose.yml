# Optional: run PostgreSQL in Docker for development
#   docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cybershield
      POSTGRES_USER: cybershield
      POSTGRES_PASSWORD: cybershield
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
